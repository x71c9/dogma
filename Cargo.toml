[package]
name = "dogma-rust"
version = "2.1.3"
authors = ["x71c9 <mail@x71c9.com>"]
edition = "2021"
description = "Opinionated CLI that bridges secrets from any vault backend and infrastructure outputs into sops-encrypted files deployed to remote machines, driven by a central dogma.yml config"
repository = "https://github.com/x71c9/dogma"
license = "MIT"

[[bin]]
name = "dogma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
git2 = { version = "0.20", default-features = false }
indexmap = { version = "2", features = ["serde"] }
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3"
tempfile = "3"
which = "6"

[package.metadata.release]
push = true
publish = true
tag-message = "chore(release): v{{version}}"
pre-release-commit-message = "chore(release): release v{{version}}"
